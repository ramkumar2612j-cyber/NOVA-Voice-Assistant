name: NOVA Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set versionCode above older installs (run number + 2000)
        run: echo "NOVA_VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' || echo 'sdkmanager skipped, using preinstalled SDK'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Source contract checks (Python, no Android needed)
        run: ./tools/run_all_checks.sh
      - name: Prepare and validate offline Vosk model
        run: ./tools/prepare_vosk_model.sh
      - name: Run unit tests and assemble debug
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Show APK version
        run: |
          echo "### NOVA v6.97 built, versionCode $NOVA_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
